media:
  input: static/uploads
  output: /uploads
content:
  - name: docs
    label: Pages
    path: src/routes
    type: collection
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: false
      - name: body
        label: Body
        type: rich-text